name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check patch files, catalogs and hashes
        run: node scripts/lint-patch.js
      - name: Report upstream version drift
        continue-on-error: true
        run: node scripts/check-upstream.js
